{% extends "base.html" %}

{% block content %}
    <section class="max-w-sm mx-auto py-10">
        <h2 class="text-3xl font-semibold">Reset Account Password</h2>
        <p class="mt-6 space-y-3 text-red-500">
            {% for message in get_flashed_messages():%}
            {{message}}
            {% endfor %}
        </p>
        <form action="{{ url_for('auth.reset_password') }}" method="post" class="mt-6 space-y-3">
            <input type="email" name="email" required placeholder="Your email"
                   class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            <input type="password" name="password1" required placeholder="New Password"
                   class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            <input type="password" name="password2" required placeholder="Please type the password again!"
                   class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">

                   <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2 rounded-md">
                Submit
            </button>
        </form>

    </section>
{% endblock %}
